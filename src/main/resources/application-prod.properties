# Activated with SPRING_PROFILES_ACTIVE=prod (Render + Neon Postgres). All secrets come from environment variables.

# --- Database (Neon Postgres) ---
# DATABASE_URL example: jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Neon free allows few connections and suspends idle compute: keep the pool tiny
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

server.port=${PORT:8080}
server.shutdown=graceful

# --- Web ---
app.cors.allowed-origins=${CORS_ORIGINS}
app.frontend-url=${FRONTEND_URL}
app.access-key=${APP_ACCESS_KEY:}
app.admin-key=${APP_ADMIN_KEY:}

# --- Jobs ---
# The Alpha Vantage job skips itself when ALPHAVANTAGE_API_KEY is empty. Bhavcopy stays on.
bhavcopy.enabled=true

# --- Logging: quieter ---
logging.level.root=WARN
logging.level.com.investmitra=INFO
spring.main.banner-mode=off
spring.jpa.show-sql=false
