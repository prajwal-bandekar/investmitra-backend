spring.application.name=investmitra-backend

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/investmitra?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Alpha Vantage (free key: 25 calls/day, ~1 call/second) ---
alphavantage.base-url=https://www.alphavantage.co/query
alphavantage.api-key=${ALPHAVANTAGE_API_KEY:}
alphavantage.request-delay=1500ms
alphavantage.daily-budget=24
alphavantage.exchange-suffix=.BSE

# --- Daily price job: 07:00 IST, Monday to Friday ---
pricejob.cron=0 0 7 * * MON-FRI

# --- Daily bhavcopy import (NSE + BSE end-of-day files): 19:30 IST, retried at 20:00 and 20:30 ---
bhavcopy.enabled=true
bhavcopy.cron=0 30 19 * * MON-FRI
bhavcopy.retry-cron=0 0,30 20 * * MON-FRI

# Stocks fetched by the daily job (NSE symbols from the catalog), 5 per sector
catalog.tracked=TCS,INFY,WIPRO,HCLTECH,TECHM,\
  HDFCBANK,ICICIBANK,SBIN,KOTAKBANK,AXISBANK,\
  RELIANCE,ONGC,BPCL,IOC,GAIL,\
  HINDUNILVR,ITC,NESTLEIND,BRITANNIA,DABUR

# --- Paper trading ---
trading.starting-cash=1000000

app.cors.allowed-origins=http://localhost:3000

# Where "/" on the backend forwards to
app.frontend-url=http://localhost:3000

# --- Error responses: never leak exception messages or stack traces ---
server.error.include-message=never
server.error.include-stacktrace=never
